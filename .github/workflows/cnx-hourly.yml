name: CNX hourly upload

# GitHub schedules use UTC. 00:00 through 17:00 UTC is 8:00 AM through 1:00 AM
# in Philippine time (Asia/Manila). The last run starts at 1:00 AM. No run is
# scheduled from 2:00 AM through 7:00 AM.
on:
  schedule:
    - cron: "0 0-17 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Run outside 8:00 AM–1:00 AM Philippine time
        type: boolean
        default: false

concurrency:
  group: cnx-hourly-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Upload blank CNX rows
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TALKPUSH_PASSWORD: ${{ secrets.TALKPUSH_PASSWORD }}
          CNX_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '' }}
        run: python -u bulk_upload.py upload
